# 40 Curated Instruction Cases for Task B-03
# 12 GoTo supported paraphrases
goto_supported:
  - id: goto_01
    instruction: "Go to the green ball."
    expected_status: "deterministic"
    family: "goto_type_color"
    subgoals: [["goto-target", ["green", "ball"]]]

  - id: goto_02
    instruction: "find the red box"
    expected_status: "deterministic"
    family: "goto_type_color"
    subgoals: [["goto-target", ["red", "box"]]]

  - id: goto_03
    instruction: "Move to a blue key."
