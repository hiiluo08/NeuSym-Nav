# 8 Deliberately ambiguous cases
ambiguous_cases:
  - id: ambig_01
    instruction: "Go to the key"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MISSING_COLOR"

  - id: ambig_02
    instruction: "find the ball."
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MISSING_COLOR"

  - id: ambig_03
    instruction: "open the door"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MISSING_COLOR"

  - id: ambig_04
    instruction: "reach a box"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MISSING_COLOR"

  - id: ambig_05
    instruction: "Pick up the red key and the blue key"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MULTIPLE_HELD_OBJECTS"

  - id: ambig_06
    instruction: "get the green key and the yellow key then go to the goal"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MULTIPLE_HELD_OBJECTS"

  - id: ambig_07
    instruction: "Open the red door then open the blue door"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_MULTIPLE_DOORS"

  - id: ambig_08
    instruction: "open the red door then pick up the red key"
    expected_status: "ambiguous"
    expected_reason: "AMBIGUOUS_ORDER_CONFLICT"

# 8 Unsupported/malformed cases
unsupported_cases:
  - id: unsup_01
    instruction: "Go to the object left of the yellow box."
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_SPATIAL_RELATION"

  - id: unsup_02
    instruction: "find the ball near the blue door"
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_SPATIAL_RELATION"

  - id: unsup_03
    instruction: "If you see a blue door, use it; otherwise use the red door."
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_CONDITIONAL"

  - id: unsup_04
    instruction: "when you find the key, go to the goal"
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_CONDITIONAL"

  - id: unsup_05
    instruction: "Put the green ball next to the box."
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_SPATIAL_RELATION"

  - id: unsup_06
    instruction: "drop the key at the start"
    expected_status: "unsupported"
    expected_reason: "UNSUPPORTED_ACTION"

  - id: unsup_07
    instruction: "dance around the room"
    expected_status: "unsupported"
    expected_reason: "OUT_OF_GRAMMAR"

  - id: unsup_08
    instruction: ""
    expected_status: "unsupported"
    expected_reason: "EMPTY_INSTRUCTION"
